# =============================================================================
# UI 自动化框架全局配置
# -----------------------------------------------------------------------------
# 为什么配置单独成文件：
#   1. base_url、超时这类"环境相关"的值不该写死在代码里——换环境只改这里（或用环境变量覆盖）；
#   2. 面试时能讲清楚"配置与代码分离"是最基础的工程习惯。
# 优先级：环境变量 UI_TEST_BASE_URL > 本文件（见 common/config_loader.py）
# =============================================================================

# 被测系统地址（demo-mall 标准端口是 5000；临时换端口跑测试时设置
# 环境变量 UI_TEST_BASE_URL=http://127.0.0.1:5001 即可，不用改本文件）
base_url: "http://127.0.0.1:5000"

# 浏览器类型：chrome / edge（驱动由 Selenium Manager 自动下载，无需手工配）
browser: chrome

# 是否无头模式：本地调试建议 false（能肉眼看到浏览器在动）；
# CI / 无人值守跑批建议 true。可用环境变量 UI_TEST_HEADLESS 覆盖。
headless: false

# 显式等待的全局超时（秒）：WebDriverWait 每次轮询 DOM 的最长等待
timeout: 10

# 浏览器窗口尺寸（宽x高）：固定尺寸保证元素布局可预期、截图可对比
window_width: 1440
window_height: 900

# 被测系统的"测试后门"钥匙：调用 /api/test/reset 重置种子数据时必须携带
test_key: "mall-test-key"

# 登录账号数据驱动文件（相对项目根目录，由 common/data_loader.py 解析）
users_file: "data/users.yaml"
