[pytest]
# 用例目录：只从 testcases/ 收集，避免把 docs/ 里的示例代码误当用例
testpaths = testcases

# 每次运行默认带上的参数：
#   --alluredir        结果目录（Allure 报告原始数据，JSON 一行一条）
#   --clean-alluredir  每次先清空结果目录，避免新旧结果混在一起
#   --reruns 1         失败自动重跑 1 次（pytest-rerunfailures）：
#                      UI 测试存在环境抖动，重跑一次能过滤大部分偶发失败；
#                      注意：重跑是"救生圈"不是"遮羞布"，重跑后仍失败才是真缺陷
#   --reruns-delay 1   每次重跑前歇 1 秒，给环境一个恢复窗口
addopts = --alluredir=reports/allure-results --clean-alluredir --reruns 1 --reruns-delay 1

# 自定义标记：pytest -m smoke 只跑冒烟集
markers =
    smoke: 冒烟用例（核心路径快速回归）

# 日志：pytest 捕获的日志在失败时随报告输出
log_cli = false
log_level = INFO
