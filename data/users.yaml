# 登录账号数据驱动文件（YAML）
# -----------------------------------------------------------------------------
# 为什么用 YAML 而不是 Excel/CSV：
#   1. YAML 原生支持中文、嵌套结构和注释，无需 pandas/openpyxl 额外依赖；
#   2. 与 pytest.mark.parametrize 组合即可完成数据驱动，代码量最少；
#   3. 测试数据（账号密码）与测试逻辑分离，换环境换账号只改本文件。
#
# 注意：账号数据必须与被测系统的种子数据（demo-mall/seed.py）保持一致，
# 种子变了这里必须同步，否则登录用例全挂——这就是"测试资产要与被测系统同版本管理"。

# ---- 有效账号：用于登录成功、下单等正向流程 ----
valid_accounts:
  - username: lemon
    password: "123456"
    nickname: 柠檬          # 登录成功后导航栏 #nav-user 显示"你好，柠檬"
  - username: test
    password: "123456"
    nickname: 测试号         # 第二个账号：用于验证"换账号也能登录"，避免用例只对单一账号有效

# ---- 无效账号：用于数据驱动的登录失败用例 ----
# expected_flash 与被测系统 web/views.py 里的 flash 文案保持一致
invalid_accounts:
  - case_name: 密码错误
    username: lemon
    password: "wrong_password"
    expected_flash: "用户名或密码错误"
  - case_name: 用户不存在
    username: ghost_user
    password: "123456"
    expected_flash: "用户名或密码错误"
  - case_name: 空用户名
    username: ""
    password: "123456"
    expected_flash: "用户名或密码错误"
